org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 资源 ID 不做 final：减少 R 类常量数量（体积 + 编译期内存），AGP 8+ 的默认值，
# 这里显式写下以免将来被构建脚本或 IDE 模板静默改回 false。
android.nonFinalResIds=true
android.builtInKotlin=false
android.newDsl=false
android.suppressUnsupportedCompileSdk=37,37.0
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
